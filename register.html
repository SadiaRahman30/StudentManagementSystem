<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
        .register-box { display: contents; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
            </div>
            <h2>Create Account</h2>
            <p>Join the Student Management System portal</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter full name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter institutional email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
            </div>

            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success">Registration successful! Redirecting...</div>

            <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <span>Create Account</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="form-footer link">
            <p>Already have an account? <a href="index.html" id="loginLink">Back to Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            
            var errEl = document.getElementById('errorMessage');
            var succEl = document.getElementById('successMessage');
            errEl.style.display = 'none';
            succEl.style.display = 'none';

            if (password !== confirmPassword) {
                errEl.textContent = 'Passwords do not match.';
                errEl.style.display = 'block';
                return;
            }

            var users = JSON.parse(localStorage.getItem('users') || '[]');
            if (users.find(function(u) { return u.email.toLowerCase() === email.toLowerCase(); })) {
                errEl.textContent = 'Email already exists.';
                errEl.style.display = 'block';
                return;
            }

            users.push({ name: name, email: email, password: password, role: 'Student' });
            localStorage.setItem('users', JSON.stringify(users));
            
            succEl.textContent = 'Registration successful! Redirecting...';
            succEl.style.display = 'block';
            setTimeout(function() { 
                window.location.href = 'index.html'; 
            }, 1200);
        });
    </script>
</body>
</html>
