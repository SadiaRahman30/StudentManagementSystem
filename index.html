<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Fallback safety styles */
        body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
        .login-box { display: contents; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h2>Student Management System</h2>
            <p>Welcome back! Sign in to access your portal</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Institutional Email</label>
                <input type="email" id="email" placeholder="e.g. admin@sms.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div id="errorMessage" class="error">Invalid email or password.</div>
            <div id="successMessage" class="success">Login successful! Redirecting to dashboard...</div>

            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <span>Sign In</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <!-- Quick Demo Credentials helper for teachers & testing -->
        <div class="demo-box">
            <div class="demo-box-header">
                <span>Demo Credentials:</span>
                <button type="button" class="demo-fill-btn" onclick="fillDemo()">Auto Fill</button>
            </div>
            <div><strong>Email:</strong> admin@sms.com &bull; <strong>Pass:</strong> admin123</div>
        </div>

        <div class="form-footer link">
            <p>Don't have an account? <a href="register.html" id="registerLink">Create Account</a></p>
        </div>
    </div>

    <script>
        // Ensure default admin user is initialized in localStorage
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([
                { name: 'Admin', email: 'admin@sms.com', password: 'admin123', role: 'Administrator' }
            ]));
        }

        function fillDemo() {
            document.getElementById('email').value = 'admin@sms.com';
            document.getElementById('password').value = 'admin123';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            
            var errEl = document.getElementById('errorMessage');
            var succEl = document.getElementById('successMessage');
            errEl.style.display = 'none';
            succEl.style.display = 'none';

            var users = JSON.parse(localStorage.getItem('users') || '[]');
            var user = users.find(function(u) { 
                return u.email.toLowerCase() === email.toLowerCase() && u.password === password; 
            });

            if (user) {
                succEl.style.display = 'block';
                localStorage.setItem('currentUser', JSON.stringify(user));
                setTimeout(function() { 
                    window.location.href = 'dashboard.html'; 
                }, 1000);
            } else {
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
